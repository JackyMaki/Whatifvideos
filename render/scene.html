<!DOCTYPE html>
<html lang="en">

<title>What if you used 100% of your brain — low poly scene</title>
<style>

  #ui { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none;
        font-family: "Inter", "Inter Display", "IPAPGothic", sans-serif; color: #fff; }

  /* title card */
  #title { left: 0; right: 0; top: 300px; text-align: center; opacity: 0; }

                background: linear-gradient(180deg, #fff6d6 0%, #ffd166 45%, #ff8a3d 100%);
                -webkit-background-clip: text; background-clip: text; color: transparent;
                filter: drop-shadow(0 12px 40px rgba(255, 140, 60, .45)); }
  #title .l2 { font-size: 64px; font-weight: 700; letter-spacing: 0.14em; text-shadow: 0 6px 30px rgba(0,0,0,.45); }

  #hud { left: 60px; right: 60px; top: 120px; opacity: 0; }

  #meterPct { font-size: 56px; font-weight: 800; min-width: 170px; text-align: right; font-variant-numeric: tabular-nums; text-shadow: 0 4px 16px rgba(0,0,0,.5); }
  #clock { left: 0; right: 0; top: 232px; text-align: center; opacity: 0; }
  #clockTime { display: inline-block; font-size: 34px; font-weight: 700; letter-spacing: .18em; padding: 12px 28px; border-radius: 999px;
               background: rgba(0,0,0,.32); box-shadow: inset 0 0 0 2px rgba(255,255,255,.22); font-variant-numeric: tabular-nums; }
  /* captions */
  #cap { left: 70px; right: 70px; top: 1330px; text-align: center; opacity: 0; }
  #capInner { display: inline-block; font-size: 54px; line-height: 1.28; font-weight: 600; padding: 26px 40px; border-radius: 28px;
              background: rgba(8, 10, 24, .55); box-shadow: 0 10px 40px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.12);
              text-shadow: 0 3px 12px rgba(0,0,0,.6); max-width: 900px; }
  #capInner em { font-style: normal; color: #ffd166; }
  #footer { left: 0; right: 0; bottom: 110px; text-align: center; font-size: 28px; letter-spacing: .26em; font-weight: 600; opacity: 0; text-shadow: 0 4px 16px rgba(0,0,0,.6); }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ui">
  <div id="title" class="abs">
    <div class="l1">WHAT IF YOU USED</div>
    <div class="big">100%</div>
    <div class="l2">OF YOUR BRAIN?</div>
  </div>
  <div id="hud" class="abs">
    <div id="meterLabel">BRAIN IN USE</div>
    <div id="meterRow"><div id="meterBar"><div id="meterFill"></div></div><div id="meterPct">10%</div></div>
  </div>
  <div id="clock" class="abs"><span id="clockTime">06:00 · SUNRISE</span></div>
  <div id="cap" class="abs"><div id="capInner"></div></div>
  <div id="footer" class="abs">A LOW POLY WHAT‑IF</div>
</div>

<script type="module">
import * as THREE from './lib/three.module.min.js';

// ---------------------------------------------------------------------------
// Deterministic helpers. Everything on screen is a pure function of time t,
// so frames can be rendered in any order by any number of workers.
// ---------------------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const R = (a = 0, b = 1) => a + (b - a) * rng();
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const lerp = (a, b, x) => a + (b - a) * x;
const frac = x => x - Math.floor(x);
// keyframe interpolation, smoothstep between keys: [[t, v], ...]
function kf(t, keys, ease = smooth) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, v0] = keys[i], [t1, v1] = keys[i + 1];
    if (t <= t1) return lerp(v0, v1, ease((t - t0) / (t1 - t0)));
  }

}
const _ca = new THREE.Color(), _cb = new THREE.Color();
function kfColor(t, keys) { // keys: [[t, '#hex'], ...]
  if (t <= keys[0][0]) return new THREE.Color(keys[0][1]);
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, c0] = keys[i], [t1, c1] = keys[i + 1];
    if (t <= t1) { _ca.set(c0); _cb.set(c1); return _ca.clone().lerp(_cb, smooth((t - t0) / (t1 - t0))); }
  }
  return new THREE.Color(keys[keys.length - 1][1]);
}
// window of visibility with fades: returns 0..1
const win = (t, a, b, fi = 0.4, fo = 0.4) => t < a || t > b ? 0 : Math.min(smooth((t - a) / fi), smooth((b - t) / fo));

// ---------------------------------------------------------------------------
// Renderer / camera
// ---------------------------------------------------------------------------
const W = 1080, H = 1920;
const canvas = document.getElementById('c');

renderer.setPixelRatio(1);
renderer.setSize(W, H, false);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 500);

// ---------------------------------------------------------------------------
// Sky: full-screen gradient quad + stars
// ---------------------------------------------------------------------------
const skyMat = new THREE.ShaderMaterial({
  depthWrite: false, depthTest: false,
  uniforms: { top: { value: new THREE.Color('#2a3f6e') }, mid: { value: new THREE.Color('#7a6aa6') }, bot: { value: new THREE.Color('#f29e6b') }, horizon: { value: 0.42 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.9999, 1.0); }`,
  fragmentShader: `varying vec2 vUv; uniform vec3 top, mid, bot; uniform float horizon;
    void main(){ float y = vUv.y; vec3 c = y > horizon ? mix(mid, top, smoothstep(horizon, 1.0, y)) : mix(bot, mid, smoothstep(horizon - 0.25, horizon, y));
      gl_FragColor = vec4(c, 1.0); }`
});
const skyQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), skyMat);
skyQuad.frustumCulled = false; skyQuad.renderOrder = -10;
scene.add(skyQuad);

const starCount = 1400;
const starPos = new Float32Array(starCount * 3), starPhase = new Float32Array(starCount);
for (let i = 0; i < starCount; i++) {
  const az = R(-Math.PI, Math.PI), el = Math.asin(R(0.02, 1)); const r = 300;
  starPos[i * 3] = r * Math.cos(el) * Math.sin(az); starPos[i * 3 + 1] = r * Math.sin(el) + 10; starPos[i * 3 + 2] = -r * Math.cos(el) * Math.cos(az);
  starPhase[i] = R(0, 6.28);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 3.8, sizeAttenuation: false, transparent: true, opacity: 0, depthWrite: false });
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ---------------------------------------------------------------------------
// Lights
// ---------------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x3a5a2a, 0.8);
scene.add(hemi);
const sunLight = new THREE.DirectionalLight(0xffffff, 2.0);
sunLight.position.set(-30, 20, -10);
scene.add(sunLight);
const brainLight = new THREE.PointLight(0x3ee0ff, 0, 30, 1.6);
scene.add(brainLight);

// ---------------------------------------------------------------------------
// Sun & moon
// ---------------------------------------------------------------------------
const sun = new THREE.Mesh(new THREE.IcosahedronGeometry(7, 1), new THREE.MeshBasicMaterial({ color: 0xffe08a, toneMapped: false }));
const sunHalo = new THREE.Mesh(new THREE.IcosahedronGeometry(12, 1), new THREE.MeshBasicMaterial({ color: 0xffb347, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
sun.add(sunHalo); scene.add(sun);
const moon = new THREE.Mesh(new THREE.IcosahedronGeometry(5, 1), new THREE.MeshLambertMaterial({ color: 0xdfe7ff, emissive: 0x8ea4d6, emissiveIntensity: 0.6, flatShading: true }));
const moonHalo = new THREE.Mesh(new THREE.IcosahedronGeometry(9, 1), new THREE.MeshBasicMaterial({ color: 0x9fb4ff, transparent: true, opacity: 0.16, blending: THREE.AdditiveBlending, depthWrite: false }));
moon.add(moonHalo); scene.add(moon);

// ---------------------------------------------------------------------------
// Terrain (faceted plane with per-face colour), mountains, trees, clouds
// ---------------------------------------------------------------------------
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v); }
function terrainH(x, z) {
  let h = vnoise(x * 0.08, z * 0.08) * 2.4 + vnoise(x * 0.2 + 7, z * 0.2) * 0.9;
  const d = Math.hypot(x, z); h *= smooth((d - 2.5) / 7); // flatten under the brain
  h += Math.max(0, d - 22) * 0.12; // rise toward the horizon
  return h - 0.6;
}
{
  const g = new THREE.PlaneGeometry(140, 140, 56, 56).toNonIndexed();
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position; const col = new Float32Array(p.count * 3); const c = new THREE.Color();
  for (let i = 0; i < p.count; i++) p.setY(i, terrainH(p.getX(i), p.getZ(i)));
  for (let f = 0; f < p.count; f += 3) {
    const y = (p.getY(f) + p.getY(f + 1) + p.getY(f + 2)) / 3;
    const base = y > 1.6 ? new THREE.Color('#b9c47a') : new THREE.Color('#5aa65a');
    c.copy(base).offsetHSL(R(-0.02, 0.02), R(-0.08, 0.08), R(-0.06, 0.06));
    for (let k = 0; k < 3; k++) { col[(f + k) * 3] = c.r; col[(f + k) * 3 + 1] = c.g; col[(f + k) * 3 + 2] = c.b; }
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true })));
}
// mountains
const rockMat = new THREE.MeshLambertMaterial({ color: 0x6f7aa0, flatShading: true });
const snowMat = new THREE.MeshLambertMaterial({ color: 0xf1f5ff, flatShading: true });
for (let i = 0; i < 26; i++) {
  const az = R(-Math.PI * 0.95, Math.PI * 0.95); if (Math.abs(az) > Math.PI * 0.72 && rng() < 0.5) continue; // fewer behind camera
  const dist = R(48, 70), h = R(10, 26), r = h * R(0.55, 0.9);
  const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, Math.floor(R(5, 8)), 1), rockMat);
  m.position.set(Math.sin(az) * dist, h / 2 - 1.5, -Math.cos(az) * dist); m.rotation.y = R(0, 6.28);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(r * 0.34, h * 0.34, m.geometry.parameters.radialSegments, 1), snowMat);
  cap.position.y = h * 0.33 + 0.02; m.add(cap); scene.add(m);
}
// trees
const trunkMat = new THREE.MeshLambertMaterial({ color: 0x7a4a2b, flatShading: true });
const leafPalette = ['#2f8f4e', '#3fa35b', '#6bb04a', '#2c7a5a', '#8bbf4a'];
const leafMats = leafPalette.map(c => new THREE.MeshLambertMaterial({ color: c, flatShading: true }));
for (let i = 0; i < 70; i++) {
  const x = R(-45, 45), z = R(-45, 12); const d = Math.hypot(x, z); if (d < 7 || (Math.abs(x) < 4 && z > -20)) continue;
  const s = R(0.8, 1.7); const g = new THREE.Group(); g.position.set(x, terrainH(x, z) - 0.1, z); g.scale.setScalar(s);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.22, 1.2, 5), trunkMat); trunk.position.y = 0.6; g.add(trunk);
  const lm = leafMats[Math.floor(R(0, leafMats.length))]; let y = 1.1;
  for (let k = 0; k < 3; k++) { const rad = 1.1 - k * 0.25, hh = 1.3 - k * 0.15; const cone = new THREE.Mesh(new THREE.ConeGeometry(rad, hh, 6), lm); cone.position.y = y + hh / 2; g.add(cone); y += hh * 0.62; }
  g.rotation.y = R(0, 6.28); scene.add(g);
}
// clouds
const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true, transparent: true, opacity: 0.95 });
const clouds = [];
for (let i = 0; i < 9; i++) {
  const g = new THREE.Group(); const n = Math.floor(R(3, 6));
  for (let k = 0; k < n; k++) { const m = new THREE.Mesh(new THREE.IcosahedronGeometry(R(1.2, 2.4), 0), cloudMat); m.position.set(R(-3, 3), R(-0.4, 0.6), R(-1, 1)); m.scale.y = 0.55; g.add(m); }
  g.userData = { x: R(-50, 50), y: R(18, 34), z: R(-70, -35), speed: R(0.25, 0.6), s: R(1, 1.9) };
  g.scale.setScalar(g.userData.s); scene.add(g); clouds.push(g);
}

// ---------------------------------------------------------------------------
// The brain: two lobes of icosahedron "folds", a cerebellum, a stem, a glow halo,
// a glowing neural network (lines + points) and a shockwave ring.
// ---------------------------------------------------------------------------
const BRAIN_Y = 6.2;
const brain = new THREE.Group(); brain.position.set(0, BRAIN_Y, 0); scene.add(brain);
const bumps = []; // {mesh, mat, rank, phase, theta}
const bumpGeo = new THREE.IcosahedronGeometry(1, 1);
function addBump(pos, radius, tint) {
  const mat = new THREE.MeshLambertMaterial({ color: tint, emissive: 0x000000, flatShading: true });
  const m = new THREE.Mesh(bumpGeo, mat); m.position.copy(pos); m.scale.setScalar(radius); m.rotation.set(R(0, 6), R(0, 6), R(0, 6));
  brain.add(m); bumps.push({ mesh: m, mat, rank: rng(), phase: R(0, 6.28), speed: R(1.5, 3.5), theta: Math.atan2(pos.z, pos.x), pos: pos.clone() });
}
{
  const N = 84, phi = Math.PI * (3 - Math.sqrt(5));
  for (const side of [-1, 1]) {
    for (let i = 0; i < N; i++) {
      const y = 1 - (i / (N - 1)) * 2, rr = Math.sqrt(1 - y * y), th = phi * i;
      const nx = Math.cos(th) * rr, ny = y, nz = Math.sin(th) * rr;
      if (side * nx < -0.28) continue;            // leave the central fissure
      if (ny < -0.62 && nz < 0) continue;         // room for the cerebellum
      const p = new THREE.Vector3(side * 0.72 + nx * 1.12, ny * 0.98, nz * 1.42);
      const tint = new THREE.Color('#f9b9c2').offsetHSL(R(-0.015, 0.015), R(-0.05, 0.05), R(-0.05, 0.05));
      addBump(p, R(0.26, 0.36), tint);
    }
  }
  for (let i = 0; i < 16; i++) { // cerebellum
    const az = R(-1.3, 1.3), el = R(-0.4, 0.5);
    const p = new THREE.Vector3(Math.sin(az) * 0.8, -0.95 + Math.sin(el) * 0.45, -0.95 - Math.cos(az) * 0.55);
    addBump(p, R(0.18, 0.26), new THREE.Color('#eea2ae'));
  }
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.3, 1.1, 6), new THREE.MeshLambertMaterial({ color: 0xd98894, flatShading: true }));
  stem.position.set(0, -1.45, -0.45); stem.rotation.x = 0.35; brain.add(stem);
}
// neural network lines between nearby folds
const links = [];
for (let i = 0; i < bumps.length; i++) for (let j = i + 1; j < bumps.length; j++) {
  const d = bumps[i].pos.distanceTo(bumps[j].pos); if (d < 0.78 && rng() < 0.55) links.push([i, j, R(0, 6.28), R(1.2, 3)]);
}
const linkPos = new Float32Array(links.length * 6), linkCol = new Float32Array(links.length * 6);
links.forEach(([i, j], k) => { const a = bumps[i].pos.clone().multiplyScalar(1.09), b = bumps[j].pos.clone().multiplyScalar(1.09); linkPos.set([a.x, a.y, a.z, b.x, b.y, b.z], k * 6); });
const linkGeo = new THREE.BufferGeometry(); linkGeo.setAttribute('position', new THREE.BufferAttribute(linkPos, 3)); linkGeo.setAttribute('color', new THREE.BufferAttribute(linkCol, 3));
const linkMesh = new THREE.LineSegments(linkGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false }));
linkMesh.renderOrder = 5; brain.add(linkMesh);
const nodePos = new Float32Array(bumps.length * 3), nodeCol = new Float32Array(bumps.length * 3);
bumps.forEach((b, i) => { const p = b.pos.clone().multiplyScalar(1.1); nodePos.set([p.x, p.y, p.z], i * 3); });
const nodeGeo = new THREE.BufferGeometry(); nodeGeo.setAttribute('position', new THREE.BufferAttribute(nodePos, 3)); nodeGeo.setAttribute('color', new THREE.BufferAttribute(nodeCol, 3));
const nodeMesh = new THREE.Points(nodeGeo, new THREE.PointsMaterial({ size: 16, sizeAttenuation: false, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, map: radialTexture(), alphaTest: 0.01 }));
nodeMesh.renderOrder = 6; brain.add(nodeMesh);
// soft glow halo behind the brain
function radialTexture(stops = [[0, 'rgba(255,255,255,1)'], [0.35, 'rgba(255,255,255,0.55)'], [1, 'rgba(255,255,255,0)']]) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128); stops.forEach(([o, col]) => grad.addColorStop(o, col)); g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; return tex;
}
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialTexture(), color: 0x3ee0ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
halo.scale.setScalar(11); halo.position.set(0, BRAIN_Y, -0.2); scene.add(halo);
const shadowBlob = new THREE.Mesh(new THREE.CircleGeometry(1.9, 8), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22, depthWrite: false }));
shadowBlob.rotation.x = -Math.PI / 2; shadowBlob.position.set(0, -0.55, 0); scene.add(shadowBlob);
const ring = new THREE.Mesh(new THREE.TorusGeometry(1, 0.08, 6, 48), new THREE.MeshBasicMaterial({ color: 0x9ff3ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
ring.position.set(0, BRAIN_Y, 0); scene.add(ring);

// ---------------------------------------------------------------------------
// Text sprites (languages, numbers)
// ---------------------------------------------------------------------------
function textSprite(text, { color = '#ffffff', size = 150, weight = 800, font = 'Inter, "Inter Display", IPAPGothic, sans-serif', stroke = 'rgba(0,0,0,0.35)' } = {}) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 384; const g = c.getContext('2d');
  g.font = `${weight} ${size}px ${font}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 18; g.strokeStyle = stroke; g.strokeText(text, 512, 200); g.fillStyle = color; g.fillText(text, 512, 200);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, opacity: 0 }));
  s.scale.set(4, 1.5, 1); scene.add(s); return s;
}

// ---------------------------------------------------------------------------
// Scene 3 props: books + greetings
// ---------------------------------------------------------------------------
const flyers = []; // generic "fly into the brain" objects {obj, t0, dur, from, ctrl, spin}
function makeFlyer(obj, t0, dur) {
  const az = R(0, 6.28), el = R(-0.25, 0.55), dist = R(11, 15);
  const from = new THREE.Vector3(Math.sin(az) * dist, BRAIN_Y + Math.sin(el) * dist * 0.8, Math.cos(az) * dist * 0.8 - 2);
  const ctrl = from.clone().multiplyScalar(0.45).add(new THREE.Vector3(0, BRAIN_Y * 0.55 + R(2, 5), 0));
  obj.traverse(o => { if (o.isMesh && o.material.emissive) { o.material = o.material.clone(); o.material.emissive.copy(o.material.color).multiplyScalar(0.28); } });
  obj.visible = false; scene.add(obj); flyers.push({ obj, t0, dur, from, ctrl, spin: new THREE.Vector3(R(-3, 3), R(-3, 3), R(-3, 3)) });
}
const coverPalette = ['#e05a4f', '#3b7dd8', '#f2b134', '#5aa65a', '#8e5ad8', '#ff8a3d', '#2fb5a3', '#d84f8e'];
for (let i = 0; i < 26; i++) {
  const g = new THREE.Group();
  const cover = new THREE.Mesh(new THREE.BoxGeometry(0.95, 1.3, 0.22), new THREE.MeshLambertMaterial({ color: coverPalette[i % coverPalette.length], flatShading: true }));
  const pages = new THREE.Mesh(new THREE.BoxGeometry(0.86, 1.2, 0.17), new THREE.MeshLambertMaterial({ color: 0xfff5e0, flatShading: true })); pages.position.x = 0.07; pages.position.z = 0.0;
  g.add(cover, pages);
  makeFlyer(g, 15.2 + i * 0.27 + R(-0.08, 0.08), 2.3);

    w.s.position.set(Math.sin(az) * rad, brain.position.y + 0.6 + u * 3.2, Math.cos(az) * rad * 0.5 + 1.5);
    const sc = (0.6 + 0.4 * smooth(u * 3)) * 1.05; w.s.scale.set(4 * sc, 1.5 * sc, 1);
    w.s.material.opacity = win(u, 0, 1, 0.15, 0.3);
  }
  // ---- memory crystals & photos (24 → 33) ----
  for (const c of crystals) {
    const on = win(t, 24.2 + c.delay, 32.6 + c.delay * 0.4, 0.7, 0.8);
    c.m.visible = on > 0; if (!on) continue;
    const a = c.a0 + t * c.speed; const y = Math.sin(a) * Math.sin(c.tilt) * c.rad;
    c.m.position.set(Math.cos(a) * c.rad, brain.position.y + y * 0.5 + 0.2, Math.sin(a) * Math.cos(c.tilt) * c.rad);
    c.m.scale.setScalar(on); c.m.rotation.set(t * c.spin, t * c.spin * 0.7, 0);
  }
  for (const ph of photos) {
    const on = win(t, 24.6 + ph.delay, 32.4, 0.8, 0.8);
    ph.m.visible = on > 0; if (!on) continue;
    const a = ph.a0 + t * ph.speed; ph.m.position.set(Math.cos(a) * ph.rad, brain.position.y + 0.4 + Math.sin(t * 1.3 + ph.bob) * 0.35, Math.sin(a) * ph.rad * 0.7);
    ph.m.lookAt(camera.position); ph.m.material.opacity = on; ph.m.scale.setScalar(0.8 + 0.2 * on);
  }
  // ---- embers (33 → 43.5) ----
  const emberOn = win(t, 33.5, 43.8, 1.5, 1.0);
  embers.material.opacity = emberOn * 0.9; embers.material.color.copy(actCol);
  if (emberOn > 0) {
    for (let i = 0; i < emberCount; i++) { const s = emberSeed[i]; const life = frac(t * s.speed + s.phase); const rad = s.rad * (0.6 + life * 0.8);
      emberPos[i * 3] = Math.sin(s.az + life * 2 + Math.sin(t + s.wob) * 0.3) * rad; emberPos[i * 3 + 1] = brain.position.y - 0.8 + life * 6.5; emberPos[i * 3 + 2] = Math.cos(s.az + life * 2) * rad; }
    emberGeo.attributes.position.needsUpdate = true;
  }
  // ---- lightning (43.5 → 52.5) ----
  let flash = 0;
  for (let i = 0; i < bolts.length; i++) {
    const b = bolts[i]; const cycle = (t + b.phase * b.period) / b.period; const f = frac(cycle);
    const show = midnight > 0.05 && f < 0.14;
    b.line.visible = b.sheath.visible = b.spark.visible = show; if (!show) continue;
    buildBolt(b, 7000 + i * 97 + Math.floor(cycle) * 13);
    const o = (1 - f / 0.14) * midnight; b.line.material.opacity = o; b.sheath.material.opacity = o * 0.35; b.spark.material.opacity = o * 0.9; flash = Math.max(flash, 1 - f / 0.14);
  }
  hemi.intensity += flash * midnight * 0.9;
  if (flash > 0) { skyMat.uniforms.mid.value.lerp(tmpC.set('#8a7ab8'), flash * midnight * 0.45); skyMat.uniforms.top.value.lerp(tmpC.set('#3a3a6a'), flash * midnight * 0.35); }

  // ---- camera ----
  const shake = midnight * 0.05 * (0.4 + 0.6 * strobe);
  camera.position.set(kf(t, CAM.x) + Math.sin(t * 0.37) * 0.25 + Math.sin(t * 23) * shake, kf(t, CAM.y) + Math.sin(t * 0.5) * 0.12 + Math.cos(t * 29) * shake, kf(t, CAM.z));
  camera.lookAt(0, kf(t, CAM.ty), 0);

  renderer.render(scene, camera);
  updateUI(t);
  return true;
};
// first render to compile shaders
window.renderAt(0);
window.__sceneReady = true;
</script>
