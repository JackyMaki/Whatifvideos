<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What if the zombie apocalypse happened — street-level low poly scene</title>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ui">
  <div id="title" class="abs">What if the <em>zombie apocalypse</em> happened?</div>
  <div id="hud" class="abs"><div id="hudLabel" class="label">Infected</div><div id="hudValue">0%</div><div id="hudSub" class="label">06:00 · Sunrise</div></div>
  <div id="cap" class="abs"><div id="capInner"></div></div>
  <div id="footer" class="abs">A what‑if, every day</div>
</div>

<script type="module">
import { THREE, mulberry32, clamp, smooth, lerp, frac, kf, kfColor, win, radialTexture, textSprite, DAY, createWorld, createOverlay, injectBaseCss } from '../../render/common.js';
import { L, lam, glowMat, solid, roundedBox, buildStreets, buildBuildings, addStorefront, buildStreetFurniture, updateTrafficLights, person, animateGait, makePedestrians, placePedestrian, buildCars } from '../../render/city.js';
injectBaseCss();

const world = createWorld({ seed: 666, canvas: document.getElementById('c'), ground: 'none', shadows: true, shadowExtent: 34, fog: 0.014, clouds: 9 });
const { rng, R, renderer, scene, camera, hemi, sunLight } = world;
const SKY = { ...DAY,
  SKY: {
    top: [[0, '#3a4f7e'], [7, '#5f9be0'], [24, '#4f8fdc'], [34, '#5a5f9e'], [39, '#4a3a7a'], [44, '#1b1f4a'], [49, '#080a1c'], [60, '#06081a']],
    mid: [[0, '#9a7aa6'], [7, '#a9cdf0'], [24, '#a6cdf2'], [34, '#c89ab0'], [39, '#ff8a5a'], [44, '#5a3d4e'], [49, '#2a1a2c'], [60, '#2a1a2c']],
    bot: [[0, '#f0a878'], [7, '#dde9f3'], [24, '#e2eef6'], [34, '#ffc89a'], [39, '#ff6a3d'], [44, '#7a3d3a'], [49, '#4a2420'], [60, '#4a2420']],
  },
  hemiSky: [[0, '#8a7ab8'], [7, '#bfd8ff'], [34, '#e0b0b0'], [44, '#4a4060'], [60, '#403650']],
  hemiGround: [[0, '#4a3a3a'], [7, '#55565a'], [44, '#2a2024'], [60, '#261c20']] };

// ---------------------------------------------------------------------------
// Timeline
// ---------------------------------------------------------------------------
const OUTBREAK = 6.6;
const infected = t => kf(t, [[OUTBREAK, 0], [8.5, 0.012], [15, 0.11], [24, 0.36], [33, 0.7], [43.5, 0.92], [60, 0.95]]);
const panic = t => kf(t, [[8.0, 0], [10.5, 1]]);
const panicIntegral = t => t < 8 ? 0 : t < 10.5 ? (() => { const u = (t - 8) / 2.5; return 2.5 * (u * u * u - u * u * u * u / 2); })() : 1.25 + (t - 10.5);
const jam = t => kf(t, [[14.5, 0], [17.5, 1]]);
const power = t => kf(t, [[24.2, 1], [24.8, 0.25], [25.3, 1], [25.9, 0.1], [26.4, 0.6], [27.0, 0]]);
const fires = t => kf(t, [[26, 0], [34, 0.6], [44, 1], [60, 1]]);
function turnTime(rank) { for (let t = OUTBREAK; t < 60; t += 0.05) if (infected(t) >= rank) return t; return 1e9; }

// ---------------------------------------------------------------------------
// City
// ---------------------------------------------------------------------------
buildStreets(world);
const buildings = buildBuildings(world, { nearHeights: [5, 9], sideHeights: [5, 8.5] });
const { lampHeads, trafficLights } = buildStreetFurniture(world);
const cars = buildCars(world, 12);
// the survivor's building: left side row, nearest the plaza centre
const roofB = buildings.filter(b => b.side === -1).sort((a, b) => Math.abs(a.z - 1.5) - Math.abs(b.z - 1.5))[0];
const ROOF_Y = roofB.h - 0.5 + 0.35, LADDER_X = roofB.x + roofB.w / 2 + 0.18;
roofB.clutter.forEach(c => c.visible = false);   // the story needs a clear roof
for (let y = 0.2; y < roofB.h; y += 0.5) { const rung = solid(new THREE.BoxGeometry(0.08, 0.08, 0.7), lam(0x3a3f48)); rung.position.set(LADDER_X, y - 0.5, roofB.z); scene.add(rung); }
for (const dz of [-0.35, 0.35]) { const rail = solid(new THREE.BoxGeometry(0.08, roofB.h + 0.8, 0.08), lam(0x3a3f48)); rail.position.set(LADDER_X, roofB.h / 2 - 0.1, roofB.z + dz); scene.add(rail); }
const DOOR_X = roofB.x + roofB.w / 2, DOOR_Z = roofB.z + 1.9;
const frontDoorFrame = solid(new THREE.BoxGeometry(0.16, 2.3, 1.3), lam(0x3a3a40)); frontDoorFrame.position.set(DOOR_X + 0.02, 0.65, DOOR_Z); scene.add(frontDoorFrame);
const frontDoor = new THREE.Group(); frontDoor.position.set(DOOR_X + 0.1, -0.5, DOOR_Z - 0.55); scene.add(frontDoor);
const frontDoorLeaf = solid(new THREE.BoxGeometry(0.08, 2.1, 1.1), lam(0x5a3a2a)); frontDoorLeaf.position.set(0, 1.05, 0.55); frontDoor.add(frontDoorLeaf);
const awning2 = solid(new THREE.BoxGeometry(1.0, 0.1, 1.8), lam(0x2f4f6f)); awning2.position.set(DOOR_X + 0.5, 1.95, DOOR_Z); scene.add(awning2);
const steps = solid(new THREE.BoxGeometry(0.6, 0.18, 1.6), lam(0x9a948a)); steps.position.set(DOOR_X + 0.35, -0.41, DOOR_Z); scene.add(steps);
const hut = solid(new THREE.BoxGeometry(1.8, 2.2, 1.8), lam(0x8a8580)); hut.position.set(roofB.x - roofB.w * 0.22, ROOF_Y + 1.1, roofB.z + roofB.d * 0.22); scene.add(hut);
const door = solid(new THREE.BoxGeometry(0.8, 1.7, 0.08), lam(0x4a3a2e)); door.position.set(hut.position.x, ROOF_Y + 0.85, hut.position.z - 0.92); scene.add(door);
const crates = [];
for (let i = 0; i < 4; i++) { const crate = solid(new THREE.BoxGeometry(0.7, 0.6, 0.7), lam(0x9a7a4e)); const from = new THREE.Vector3(roofB.x + roofB.w * 0.3 - i * 0.5, ROOF_Y + 0.3 + (i === 3 ? 0.6 : 0), roofB.z - roofB.d * 0.3 + (i % 2) * 0.6); crate.position.copy(from); crate.rotation.y = i * 0.4; scene.add(crate); crates.push({ m: crate, from, to: new THREE.Vector3(hut.position.x - 0.5 + (i % 2) * 0.75, ROOF_Y + 0.3 + (i > 1 ? 0.6 : 0), hut.position.z - 1.45), t0: 25.2 + i * 1.1 }); }
const barrel = solid(new THREE.CylinderGeometry(0.42, 0.38, 1.0, 12), lam(0x55504a)); barrel.position.set(roofB.x, ROOF_Y + 0.5, roofB.z - 0.6); scene.add(barrel);
const flame = new THREE.Mesh(new THREE.ConeGeometry(0.34, 1.0, 8), glowMat(0xff8a3d, 0)); flame.position.set(barrel.position.x, ROOF_Y + 1.45, barrel.position.z); scene.add(flame);
const flameGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialTexture(), color: 0xff9a4a, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })); flameGlow.scale.setScalar(3.5); flameGlow.position.copy(flame.position); scene.add(flameGlow);
const fireLight = new THREE.PointLight(0xff9a4a, 0, 18, 1.6); fireLight.position.set(barrel.position.x, ROOF_Y + 1.8, barrel.position.z); scene.add(fireLight);
// shop fronts across the street; the supermarket sits near x = 4
const signB = buildings.filter(b => b.row === 'shop').sort((a, b) => Math.abs(a.x - 4) - Math.abs(b.x - 4))[0];
const market = addStorefront(world, signB, { name: 'SUPERMARKET', color: '#d63a2f', awning: 0xb83a30 });
for (const [bx, nm, col, aw] of [[-12, 'CAFÉ', '#2f6f4e', 0x2f6f4e], [16, 'PHARMACY', '#2f7fbf', 0x2f5f8f]]) { const b = buildings.filter(b => b.row === 'shop' && b !== signB).sort((a, c) => Math.abs(a.x - bx) - Math.abs(c.x - bx))[0]; if (b) addStorefront(world, b, { name: nm, color: col, awning: aw }); }

// ---------------------------------------------------------------------------
// People
// ---------------------------------------------------------------------------
const ZSKIN = new THREE.Color(0x8fa37a), ZSHIRT = new THREE.Color(0x3a3f3a), ZPANTS = new THREE.Color(0x2a2a2a);
const peds = makePedestrians(world, [
  { axis: 'x', at: L.farWalk, from: -50, to: 50, dir: 1, count: 9, speed: 1.3 }, { axis: 'x', at: L.farWalk, from: -50, to: 50, dir: -1, count: 8, speed: 1.15 },
  { axis: 'x', at: L.nearWalk, from: -50, to: 50, dir: 1, count: 7, speed: 1.2 }, { axis: 'x', at: L.nearWalk, from: -50, to: 50, dir: -1, count: 7, speed: 1.35 },
  { axis: 'z', at: -L.sideX + 1.5, from: -18, to: 15, dir: 1, count: 3, speed: 1.1 }, { axis: 'z', at: L.sideX - 1.5, from: -18, to: 15, dir: -1, count: 3, speed: 1.2 },
], { gap: 2.6, laneOffset: 0.45 });
for (const p of peds) { const m = p.g.userData.mats; p.base0 = { skin: m.skin.color.clone(), shirt: m.shirt.color.clone(), pants: m.pants.color.clone() }; p.tz = turnTime(p.rank); p.zombieShift = p.lane.axis === 'x' ? (p.lane.at === L.farWalk ? 0.85 : -0.85) : (p.lane.at < 0 ? 0.9 : -0.9); }
// standers on the plaza, clear of the lanes
const standers = [];
for (const [x, z, ry, extra] of [[-3.4, 3.4, 0.6, { phone: true }], [4.6, 3.0, -0.8, {}], [-2.4, -3.6, 2.4, { phone: true }], [6.0, -2.8, -2.6, {}], [2.6, 6.2, 2.9, {}], [1.6, -0.6, 1.8, { phone: true }]]) { const g = person(world, extra); g.position.set(x, -0.5, z); g.rotation.y = ry; scene.add(g); const m = g.userData.mats; standers.push({ g, x, z, ry, ph: R(0, 6.28), rank: R(0.05, 1), flee: R(0, 1) < 0.5 ? -1 : 1, base0: { skin: m.skin.color.clone(), shirt: m.shirt.color.clone(), pants: m.pants.color.clone() } }); }
for (const s of standers) s.tz = turnTime(s.rank);
const zero = (() => { const g = person(world, { jacket: 0x7a3a2e }); g.position.set(-1.2, -0.5, L.shopFront + 0.5); g.rotation.y = Math.PI; scene.add(g); const m = g.userData.mats; return { g, x: -1.2, z: L.shopFront + 0.5, ry: Math.PI, ph: R(0, 6.28), base0: { skin: m.skin.color.clone(), shirt: m.shirt.color.clone(), pants: m.pants.color.clone() }, tz: OUTBREAK, zero: true, flee: 0 }; })();
standers.push(zero);
const crowd = [];
for (let i = 0; i < 16; i++) { const g = person(world, { skin: 0x8fa37a, shirt: 0x3a3f3a, pants: 0x2a2a2a, jacket: false }); g.visible = false; scene.add(g); const edge = i % 3; crowd.push({ g, t0: 28 + i * 0.9 + R(0, 0.6), from: edge === 0 ? new THREE.Vector3(R(-4, 12), -0.5, L.farWalk) : edge === 1 ? new THREE.Vector3(14.5, -0.5, R(-4, 8)) : new THREE.Vector3(R(2, 12), -0.5, 9.2), to: new THREE.Vector3(LADDER_X + 1.4 + (i % 4) * 0.9, -0.5, roofB.z - 2.2 + Math.floor(i / 4) * 1.1), ph: R(0, 6.28), speed: R(0.25, 0.4) }); }

// hero + neighbours
const hero = person(world, { skin: 0xf1c27d, shirt: 0xe8e2d6, pants: 0x2b3a55, hair: 0x2a1a0e, jacket: 0x5d6b4a, hairStyle: 'short', bag: true }); scene.add(hero);
const cup = solid(new THREE.CylinderGeometry(0.09, 0.07, 0.24, 10), lam(0xf4efe6)); cup.position.set(0, -0.78, 0.04); hero.userData.limbs.ra.add(cup); const lid = solid(new THREE.CylinderGeometry(0.1, 0.1, 0.03, 10), lam(0x3a2a1a)); lid.position.y = 0.13; cup.add(lid);
const STAND = new THREE.Vector3(-4.8, -0.5, 1.2), DROP = new THREE.Vector3(-5.7, -0.4, 1.7);
const droppedCup = solid(new THREE.CylinderGeometry(0.09, 0.07, 0.24, 10), lam(0xf4efe6)); droppedCup.rotation.z = Math.PI / 2; droppedCup.position.copy(DROP); droppedCup.visible = false; scene.add(droppedCup);
const survivors = [0, 1].map(i => { const g = person(world, i === 0 ? { hairStyle: 'cap', bag: true } : { hairStyle: 'long' }); scene.add(g); return { g, ph: R(0, 6.28), i }; });

// smoke, burning car, lights
const smokeCols = [];
function addSmoke(pos, count, spread, rise, size, color) {
  const posArr = new Float32Array(count * 3); const seeds = []; for (let i = 0; i < count; i++) seeds.push({ phase: rng(), az: R(0, 6.28), rad: R(0, spread), speed: R(0.08, 0.16) });
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color, size, sizeAttenuation: true, transparent: true, opacity: 0, depthWrite: false, map: radialTexture([[0, 'rgba(255,255,255,0.8)'], [0.5, 'rgba(255,255,255,0.3)'], [1, 'rgba(255,255,255,0)']]), alphaTest: 0.01 }));
  scene.add(pts); smokeCols.push({ pts, posArr, seeds, pos, rise }); return pts;
}
const fireB = buildings.filter(b => b.row === 'mid').sort((a, b) => a.rank - b.rank).slice(0, 3);
for (const b of fireB) addSmoke(new THREE.Vector3(b.x, b.h - 0.5, b.z), 60, 2.5, 18, 6.5, 0x5a5a60);
const burnCar = cars[3];
addSmoke(new THREE.Vector3(0, 0.6, burnCar.userData.laneZ), 50, 0.8, 9, 3.5, 0x4a4a50);
const carFlame = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.6, 8), glowMat(0xff8a3d, 0)); scene.add(carFlame);
const carGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialTexture(), color: 0xff9a4a, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })); carGlow.scale.setScalar(5); scene.add(carGlow);
const carLight = new THREE.PointLight(0xff8a3d, 0, 20, 1.6); scene.add(carLight);
const ladderLamp = new THREE.PointLight(0xbfd0ff, 0, 14, 1.5); ladderLamp.position.set(LADDER_X + 1.4, ROOF_Y + 1.2, roofB.z + 0.6); scene.add(ladderLamp);
const moonLamp = new THREE.PointLight(0x9fb4ff, 0, 30, 1.4); moonLamp.position.set(roofB.x + 3, ROOF_Y + 7, roofB.z + 5); scene.add(moonLamp);

// ---------------------------------------------------------------------------
// Camera & overlay
// ---------------------------------------------------------------------------
const RX = roofB.x, RZ = roofB.z, RY = ROOF_Y, HX = hut.position.x, HZ = hut.position.z, BX = barrel.position.x, BZ = barrel.position.z;
const CAM = {
  x: [[0, -2.0], [4.5, -0.4], [6, 0.6], [12.5, 0.8], [14.5, -2.5], [17.5, RX + 4.6], [23, RX + 4.2], [24.5, HX + 5.6], [31.5, HX + 5.4], [33.5, RX + 4.5], [42.5, RX + 4.0], [44, BX + 4.2], [52, BX + 4.0], [53.5, RX + 0.4], [56.5, RX + 0.6], [60, LADDER_X + 2.4]],
  y: [[0, 2.4], [4.5, 2.5], [6, 2.3], [12.5, 2.4], [14.5, 3.4], [17.5, RY + 6.0], [23, RY + 5.6], [24.5, RY + 4.6], [31.5, RY + 4.4], [33.5, RY + 4.5], [42.5, RY + 4.0], [44, RY + 2.7], [52, RY + 2.6], [53.5, RY + 2.6], [56.5, RY + 2.6], [60, RY + 1.6]],
  z: [[0, 9.5], [4.5, 10.5], [6, 9.5], [12.5, 9.0], [14.5, 9.5], [17.5, RZ + 7.5], [23, RZ + 7.0], [24.5, HZ - 6.8], [31.5, HZ - 6.6], [33.5, RZ + 7.5], [42.5, RZ + 6.5], [44, BZ + 4.6], [52, BZ + 4.4], [53.5, RZ + 4.4], [56.5, RZ + 4.2], [60, RZ + 3.2]],
  tx: [[0, -7.5], [4.5, -4.5], [6, -3.0], [12.5, -3.0], [14.5, -7], [17.5, RX - 1.0], [23, RX - 1.0], [24.5, HX + 0.6], [31.5, HX + 0.6], [33.5, 0], [42.5, 0], [44, BX], [52, BX], [53.5, signB.x * 0.6], [56.5, signB.x * 0.6], [60, LADDER_X + 0.4]],
  ty: [[0, 1.2], [4.5, 1.4], [6, 1.5], [12.5, 1.6], [14.5, 2.5], [17.5, RY - 4.5], [23, RY - 4.5], [24.5, RY + 0.4], [31.5, RY + 0.4], [33.5, 0.5], [42.5, 0.5], [44, RY + 0.9], [52, RY + 0.9], [53.5, 3.6], [56.5, 3.6], [60, RY - 2.0]],
  tz: [[0, 1.5], [4.5, 0.5], [6, -3], [12.5, -4], [14.5, -2], [17.5, RZ - 14], [23, RZ - 14], [24.5, HZ - 1.0], [31.5, HZ - 1.0], [33.5, -10], [42.5, -10], [44, BZ], [52, BZ], [53.5, signB.z], [56.5, signB.z], [60, RZ - 1.0]],
};
const overlay = createOverlay({ highlight: /(coffee in hand|bites a stranger|double, and double again|roads are jammed|you run up|your own fire escape|power grid fails|the rooftop door|the city is theirs|nine in ten people are gone|stayed quiet, and stayed high|isn't the dead|the people beside you|slips away|the rooftop|the supermarket)/gi });
const hud = { value: document.getElementById('hudValue'), label: document.getElementById('hudLabel') };
function updateHud(t) {
  const f = infected(t) * 100;
  hud.value.textContent = f <= 0 ? '0%' : f < 10 ? `${f.toFixed(1)}%` : `${Math.round(f)}%`;
  hud.value.style.color = f > 50 ? '#ff6a5a' : '#fff';
  hud.label.textContent = t >= 43.5 ? 'Infected · day one' : 'Infected';
}

// ---------------------------------------------------------------------------
// Hero blocking
// ---------------------------------------------------------------------------
function heroPose(t) {
  if (t < 1.2) return { pos: new THREE.Vector3(DOOR_X - 0.6, -0.5, DOOR_Z), ry: Math.PI / 2, mode: 'idle', cup: true };
  if (t < 4.6) { const u = smooth((t - 1.2) / 3.4); return { pos: new THREE.Vector3(lerp(DOOR_X - 0.6, STAND.x, u), -0.5, lerp(DOOR_Z, STAND.z, u)), ry: Math.PI / 2 + u * 0.1, mode: 'walk', phase: t * 9, cup: true }; }
  if (t < 9.2) return { pos: STAND.clone(), ry: Math.PI * 0.62, mode: 'idle', cup: true, sip: Math.sin(t * 1.1) > 0.6 };
  if (t < 13) { const s = smooth((t - 9.2) / 1.4); return { pos: new THREE.Vector3(STAND.x - s * 1.4, -0.5, STAND.z + s * 0.6), ry: lerp(Math.PI * 0.62, Math.PI * 0.5, s), mode: 'idle', cup: s < 0.5, dropCup: s >= 0.5 }; }
  if (t < 15.2) { const u = smooth((t - 13) / 2.2); return { pos: new THREE.Vector3(lerp(STAND.x - 1.4, LADDER_X + 0.5, u), -0.5, lerp(STAND.z + 0.6, RZ, u)), ry: -Math.PI / 2 + 0.3 * (1 - u), mode: 'run', phase: t * 14 }; }
  if (t < 17.4) { const u = (t - 15.2) / 2.2; return { pos: new THREE.Vector3(LADDER_X + 0.45, lerp(-0.5, RY + 0.05, u), RZ), ry: -Math.PI / 2, mode: 'climb', phase: t * 7 }; }
  const EDGE = new THREE.Vector3(RX - roofB.w * 0.1, RY, RZ - roofB.d / 2 + 1.3);
  if (t < 18.4) { const u = smooth((t - 17.4) / 1.0); return { pos: new THREE.Vector3(lerp(LADDER_X + 0.45, EDGE.x, u), RY, lerp(RZ, EDGE.z, u)), ry: lerp(-Math.PI / 2, Math.PI, u), mode: 'walk', phase: t * 9 }; }
  if (t < 24.5) return { pos: EDGE, ry: Math.PI, mode: 'idle', lookDown: true };
  if (t < 33.5) {
    const u = smooth((t - 24.5) / 1.2); if (u < 1) return { pos: new THREE.Vector3(lerp(EDGE.x, crates[0].from.x + 0.9, u), RY, lerp(EDGE.z, crates[0].from.z, u)), ry: lerp(Math.PI, -Math.PI / 2, u), mode: 'walk', phase: t * 9 };
    const c = crates.find(c => t < c.t0 + 1.6) || crates[3]; const k = clamp((t - c.t0) / 1.6, 0, 1);
    if (t < 25.2 || (k >= 1 && c === crates[3])) return { pos: new THREE.Vector3(crates[3].to.x + 0.9, RY, crates[3].to.z + 0.3), ry: -Math.PI / 2, mode: 'idle' };
    const pos = c.from.clone().lerp(c.to, smooth(k)); const dir = c.to.clone().sub(c.from); const ang = Math.atan2(dir.x, dir.z);
    return { pos: new THREE.Vector3(pos.x - Math.sin(ang) * 0.75, RY, pos.z - Math.cos(ang) * 0.75), ry: ang, mode: 'walk', phase: t * 7, pushing: true, amp: 0.5 };
  }
  if (t < 44) { const u = smooth((t - 33.5) / 1.6); return { pos: new THREE.Vector3(lerp(crates[3].to.x + 0.9, RX + roofB.w * 0.2, u), RY, lerp(crates[3].to.z + 0.3, RZ - roofB.d / 2 + 1.0, u)), ry: lerp(-Math.PI / 2, Math.PI, u), mode: u < 1 ? 'walk' : 'idle', phase: t * 9, lookDown: true }; }
  if (t < 53.5) { const u = smooth((t - 44) / 1.4); return { pos: new THREE.Vector3(lerp(RX + roofB.w * 0.2, BX + 1.4, u), RY, lerp(RZ - roofB.d / 2 + 1.0, BZ - 1.2, u)), ry: lerp(Math.PI, Math.PI * 0.75, u), mode: u < 1 ? 'walk' : 'idle', phase: t * 9 }; }
