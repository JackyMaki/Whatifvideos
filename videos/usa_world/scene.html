  const cols = stars <= 50 ? 6 : 15, rows = Math.ceil(stars / cols); const cw = 304 / (cols + 1), rh = (400 * 7 / 13) / (rows + 1); const r = Math.min(cw, rh) * 0.34;

const STAND = new THREE.Vector3(-3.8, -0.5, 2.2);

  else if (t < 16.0) { const u = smooth((t - 13.4) / 2.4); walk(worker, WORKER_SPOT, new THREE.Vector3(9.5, -0.5, 7.5), u, t); }
