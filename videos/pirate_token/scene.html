function panelSprite(w, h, scale) { const c = document.createElement('canvas'); c.width = w; c.height = h; const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, opacity: 0 })); s.scale.set(scale, scale * h / w, 1); scene.add(s); return { c, g: c.getContext('2d'), tex, s }; }
function drawTag(p, text, color = '#7cf5ff', bg = 'rgba(10,20,36,0.85)') { const g = p.g; g.clearRect(0, 0, p.c.width, p.c.height); g.fillStyle = bg; g.beginPath(); g.roundRect(8, 8, p.c.width - 16, p.c.height - 16, 26); g.fill(); g.strokeStyle = color; g.lineWidth = 8; g.stroke(); g.fillStyle = color; g.font = `700 ${Math.round(p.c.height * 0.42)}px Inter, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, p.c.width / 2, p.c.height / 2 + 4); p.tex.needsUpdate = true; }

const locker = panelSprite(900, 1100, 2.1);
{ const g = locker.g; g.clearRect(0, 0, 900, 1100); g.fillStyle = 'rgba(10,16,30,0.9)'; g.beginPath(); g.roundRect(10, 10, 880, 1080, 40); g.fill(); g.strokeStyle = '#7cf5ff'; g.lineWidth = 8; g.stroke(); g.fillStyle = '#e6fbff'; g.font = '700 70px Inter, sans-serif'; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText('LOCKER · 400 ITEMS', 50, 80); const cols = ['#ff3b2f', '#7cf5ff', '#ffd04a', '#b8ff7a', '#d84f8e', '#8e5ad8', '#2fb5a3', '#ff8a3d']; let k = 0; for (let r = 0; r < 7; r++) for (let c = 0; c < 6; c++) { g.fillStyle = cols[(k++) % cols.length]; g.globalAlpha = 0.85; g.beginPath(); g.roundRect(50 + c * 135, 150 + r * 130, 115, 110, 18); g.fill(); } g.globalAlpha = 1; locker.tex.needsUpdate = true; }

const handToken = makeToken(); handToken.scale.setScalar(0.8); handToken.position.set(0, -0.76, 0.14); you.userData.limbs.ra.add(handToken); handToken.visible = false;
const fans = [];
for (let i = 0; i < 10; i++) { const g = person(world, { bag: true }); g.visible = false; scene.add(g); const a = -2.4 + i * (4.8 / 9); fans.push({ g, a, start: new THREE.Vector3(Math.sin(a) * 14, FLOOR, Math.cos(a) * 14 - 1), end: new THREE.Vector3(Math.sin(a) * 3.8, FLOOR, Math.cos(a) * 3.8 - 1), t0: 33.6 + i * 0.5, ph: R(0, 6.28), msg: panelSprite(520, 150, 1.6) }); drawTag(fans[i].msg, 'can you gift me?', '#ffd27a'); }
const youBase = { shirt: new THREE.Color(0x3b7dd8), pants: new THREE.Color(0x2b3a55) };
function setOutfit(g, shirt, pants, jacketCol) { const m = g.userData.mats; m.shirt.color.set(shirt); m.pants.color.set(pants); if (g.userData.jacket) g.userData.jacket.color.set(jacketCol || shirt); }

// camps / positions
const CAMP = { you: new THREE.Vector3(1.6, FLOOR, -1.3), dex: new THREE.Vector3(-0.7, FLOOR, 1.5), mo: new THREE.Vector3(2.9, FLOOR, 1.7), youStart: new THREE.Vector3(-9, FLOOR, 5), dexStart: new THREE.Vector3(-12, FLOOR, -2), moStart: new THREE.Vector3(8, FLOOR, 7) };
const SHOP_PATH = i => { const a = pedestals[i].a; return new THREE.Vector3(SHOP.x + Math.sin(a) * (PED_R - 1.7), SHOP.y, SHOP.z - Math.cos(a) * (PED_R - 1.7)); };
const CENTER = new THREE.Vector3(SHOP.x, SHOP.y, SHOP.z + 0.5);

const CAM = {
  x: [[0, -2.5], [6, 0.5], [8.2, 2.2], [11, 1.2], [14.9, 0.8], [15, SHOP.x - 4.5], [23.9, SHOP.x + 3.6], [24, SHOP.x + 1.0], [32.9, SHOP.x - 1.2], [33, 3.5], [43.4, 3.2], [43.5, SHOP.x + 2.8], [52.4, SHOP.x + 2.4], [52.5, 2.8], [60, 4.5]],
  y: [[0, 2.3], [6, 2.1], [8.2, 1.9], [11, 2.3], [14.9, 2.3], [15, SHOP.y + 2.4], [23.9, SHOP.y + 2.6], [24, SHOP.y + 2.8], [32.9, SHOP.y + 2.6], [33, 2.6], [43.4, 2.8], [43.5, SHOP.y + 2.3], [52.4, SHOP.y + 2.2], [52.5, 2.0], [60, 2.6]],
  z: [[0, 8.5], [6, 6.5], [8.2, 3.0], [11, 8.6], [14.9, 8.2], [15, SHOP.z + 6.0], [23.9, SHOP.z + 7.6], [24, SHOP.z + 7.5], [32.9, SHOP.z + 7.0], [33, 7.5], [43.4, 7.0], [43.5, SHOP.z + 5.6], [52.4, SHOP.z + 5.4], [52.5, 6.5], [60, 9.5]],
  tx: [[0, 1.5], [6, 2.5], [8.2, 3.0], [11, 1.2], [14.9, 1.0], [15, SHOP.x - 3.0], [23.9, SHOP.x + 2.0], [24, SHOP.x - 0.5], [32.9, SHOP.x + 0.5], [33, 0.5], [43.4, 0.5], [43.5, SHOP.x], [52.4, SHOP.x], [52.5, 1.2], [60, 0.8]],
  ty: [[0, 0.5], [6, 0.6], [8.2, 0.5], [11, 1.0], [14.9, 1.0], [15, SHOP.y + 1.2], [23.9, SHOP.y + 1.2], [24, SHOP.y + 1.0], [32.9, SHOP.y + 1.1], [33, 1.0], [43.4, 1.2], [43.5, SHOP.y + 1.6], [52.4, SHOP.y + 1.4], [52.5, 0.8], [60, 0.9]],
  tz: [[0, -2.0], [6, -2.4], [8.2, -2.4], [11, -0.8], [14.9, -0.6], [15, SHOP.z - 3.5], [23.9, SHOP.z - 3.0], [24, SHOP.z - 1.5], [32.9, SHOP.z - 2.0], [33, -1.0], [43.4, -1.0], [43.5, SHOP.z - 1.6], [52.4, SHOP.z - 1.6], [52.5, -0.5], [60, -1.0]],
};
const overlay = createOverlay({ highlight: /(something gold spins out|a hundred and thirty-seven thousand|the pirate token|doesn't believe you|fourteen free days|no junk|every skin you've wanted|thirty-one before lunch|every emote|every pickaxe|every bundle you skipped|four hundred|everyone wants to be your duo|two hundred messages|can't gift|two hundred times|the shop locks|can't decide|wear the default|the first skin you'd buy|tell your squad)/gi });
const hud = { value: document.getElementById('hudValue'), label: document.getElementById('hudLabel') };
function updateHud(t) {
  let label = 'Odds, per match', value = '1 in 137,500', color = '#fff';
  if (t >= 9.6 && t < 15) { label = 'Pirate shop token'; value = 'Found'; color = '#ffd27a'; }
  else if (t >= 15 && t < 24) { label = 'Skins bought'; value = String(Math.round(kf(t, [[15.4, 0], [23.0, 31]], x => x))); color = '#7cf5ff'; }
  else if (t >= 24 && t < 33) { label = 'Locker items'; value = String(Math.round(kf(t, [[24.4, 12], [32.0, 400]], x => x))); color = '#7cf5ff'; }
  else if (t >= 33 && t < 43.5) { label = 'Gift requests'; value = String(Math.round(kf(t, [[34.0, 0], [42.0, 200]], x => x))); color = '#ffd27a'; }
  else if (t >= 43.5 && t < 52.5) { label = 'Free days left'; value = String(Math.round(kf(t, [[43.8, 14], [47.5, 0]], x => x))); color = '#ff6a5a'; }
  else if (t >= 52.5) { label = 'Tokens left'; value = '1 · for 2027'; color = '#ffd27a'; }
  hud.label.textContent = label; hud.value.textContent = value; hud.value.style.color = color; hud.value.style.fontSize = value.length > 9 ? '84px' : '';
}

// ---------------------------------------------------------------------------
// Blocking helpers
// ---------------------------------------------------------------------------
function run(g, from, to, u, t, speed = 13, gait = 'run') { g.position.lerpVectors(from, to, u); g.rotation.y = Math.atan2(to.x - from.x, to.z - from.z); animateGait(g, t * speed, gait); }
function idle(g, pos, ry, t, ph = 0) { g.position.copy(pos); g.rotation.y = ry; animateGait(g, t * 1.4 + ph, 'idle'); }
function faceTo(g, target) { g.rotation.y = Math.atan2(target.x - g.position.x, target.z - g.position.z); }
function crouchOpen(g, u, t) { const Lb = g.userData.limbs; g.position.y += -0.3 * u; Lb.ll.rotation.x = -1.3 * u; Lb.rl.rotation.x = -0.6 * u; g.userData.torso.rotation.x = 0.35 * u; Lb.ra.rotation.x = -1.2 * u; Lb.la.rotation.x = -0.4 * u; Lb.head.rotation.x = 0.35 * u; }
function cheer(g, t, ph = 0) { const Lb = g.userData.limbs; Lb.la.rotation.x = -2.7; Lb.ra.rotation.x = -2.7; Lb.la.rotation.z = 0.5; Lb.ra.rotation.z = -0.5; Lb.head.rotation.x = -0.35; g.position.y += Math.max(0, Math.sin(t * 7 + ph)) * 0.25; }
function shrug(g, u) { const Lb = g.userData.limbs; Lb.la.rotation.x = -0.6 * u; Lb.ra.rotation.x = -0.6 * u; Lb.la.rotation.z = 0.9 * u; Lb.ra.rotation.z = -0.9 * u; Lb.head.rotation.z = 0.2 * u; }
function dance(g, t, ph) { const Lb = g.userData.limbs; const s = Math.sin(t * 6 + ph); Lb.la.rotation.x = -1.2 + s * 1.0; Lb.ra.rotation.x = -1.2 - s * 1.0; Lb.la.rotation.z = 0.4; Lb.ra.rotation.z = -0.4; Lb.ll.rotation.x = s * 0.35; Lb.rl.rotation.x = -s * 0.35; g.userData.torso.rotation.x = 0; Lb.head.rotation.z = s * 0.15; g.position.y += Math.abs(s) * 0.12; g.rotation.y += Math.sin(t * 3 + ph) * 0.25; }
function headShake(g, u, t) { g.userData.limbs.head.rotation.y = Math.sin(t * 9) * 0.45 * u; }

// ---------------------------------------------------------------------------
// Per-frame update
// ---------------------------------------------------------------------------
const tmpV = new THREE.Vector3();
window.renderAt = function (t) {
  const { nt } = world.updateEnvironment(t, SKY);
  const inShop = (t >= 15 && t < 33) || (t >= 43.5 && t < 52.5);
  sunLight.position.set((inShop ? SHOP.x : 0) + lerp(-34, 30, clamp(t / 40, 0, 1)), lerp(20, 34, Math.sin(clamp(t / 40, 0, 1) * Math.PI)), (inShop ? SHOP.z : 0) + 18);
  sunLight.target.position.set(inShop ? SHOP.x : 0, 0, inShop ? SHOP.z : 0); sunLight.target.updateMatrixWorld();
  moonLamp.position.set(inShop ? SHOP.x + 2 : 2, inShop ? SHOP.y + 6 : 6, inShop ? SHOP.z + 4 : 4); moonLamp.intensity = nt * 55;
  shopLight.intensity = inShop ? (t < 43.5 ? 18 : 10) : 0;

  // ---------------- island: find the token (0-15) ----------------
  const chestSpot = new THREE.Vector3(CHEST.x - 1.3, FLOOR, CHEST.z + 0.9);
  if (t < 7.6) { const u = clamp((t - 1.6) / 6.0, 0, 1); run(you, CAMP.youStart, chestSpot, smooth(u), t, 12, u < 1 ? 'run' : 'idle'); if (u >= 1) idle(you, chestSpot, Math.atan2(CHEST.x - chestSpot.x, CHEST.z - chestSpot.z), t); }
