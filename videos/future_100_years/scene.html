{

// ---------------------------------------------------------------------------
// Per-frame update

const tmpV = new THREE.Vector3(), tmpC = new THREE.Color(), UP = new THREE.Vector3(0, 1, 0);
window.renderAt = function (t) {

  const startle = t > WAKE + 1.2 ? Math.exp(-(t - WAKE - 1.2) * 3) : 0;

  const asleep = Math.max(win(t, -1, WAKE + 0.4, 0.1, 0.9), win(t, 56.6, 61, 0.9, 0.1));

    else { const z = ((s * path.dir + 16) % 30 + 30) % 30 - 16; g.position.set(path.x, -0.5, z); g.rotation.y = path.dir > 0 ? 0 : Math.PI; }
    const sw = Math.sin(t * 7 * speed * 0.8 + ph) * 0.55; const L = g.userData.limbs;
    L.ll.rotation.x = sw; L.rl.rotation.x = -sw; L.la.rotation.x = -sw * 0.8; L.ra.rotation.x = sw * 0.8; g.position.y = -0.5 + Math.abs(Math.cos(t * 7 * speed * 0.8 + ph)) * 0.04;
  }
  for (const s of standers) { const L = s.g.userData.limbs; const idle = Math.sin(t * 1.3 + s.ph) * 0.05; L.la.rotation.x = -0.9 * cu + idle; L.ra.rotation.x = -0.9 * cu - idle; L.la.rotation.z = 0.25 * cu; L.ra.rotation.z = -0.25 * cu; s.g.rotation.z = idle * 0.3; }

  // --- city upgrade: buildings grow, trims glow, windows light at night ---
  const windowsOn = clamp(nt * 1.1 + cu * 0.12, 0, 1);
  for (const b of buildings) {
    const u = smooth((cu - b.delay) / 0.4); const sy = lerp(1, b.grow, u);
    b.body.scale.y = sy; b.body.position.y = b.h * sy / 2; b.roof.position.y = b.h * sy + 0.17;
    for (let k = 0; k < 4; k++) { b.trims[k].scale.y = sy; b.trims[k].position.y = b.h * sy / 2; b.trims[k].material.opacity = u * 0.85 * (0.45 + 0.55 * nt + 0.2); }
    b.trims[4].position.y = b.h * sy + 0.4; b.trims[4].material.opacity = u * 0.85 * (0.45 + 0.55 * nt + 0.2);

  }

  for (const tl of trafficLights) { const ph = frac(t / 8 + tl.phase); tl.lights.forEach((l, i) => { const on = i === (ph < 0.5 ? 2 : ph < 0.6 ? 1 : 0); l.material.color.set([0xff3b2f, 0xffc93c, 0x3bd35a][i]).multiplyScalar(on ? 1 : 0.18); }); }
  // --- cars ---
  for (const c of cars) {

    const speed = lerp(d.speed, d.speed * 1.8, lift); const x = ((d.x0 + d.dir * speed * t + 50) % 100 + 100) % 100 - 50;

  for (const ph of peopleHolos) { const on = win(t, 15 + ph.delay, 52.5, 0.6, 1.0) * cu; ph.m.visible = on > 0; if (!on) continue; tmpV.set(0, 1.5, 0.75).applyAxisAngle(UP, ph.s.g.rotation.y).add(ph.s.g.position); ph.m.position.copy(tmpV); ph.m.rotation.y = ph.s.g.rotation.y; ph.m.material.opacity = on * 0.85; }
  { const u = (t - 24.6) / 5.4; const on = u > 0 && u < 1 ? win(u, 0, 1, 0.1, 0.2) : 0; phone.visible = on > 0;

  { const on = win(t, 48.6, 52.0, 0.6, 0.8); yearTag.material.opacity = on; yearTag.position.set(0, 7.6 + (1 - on) * 0.4, 0); yearTag.scale.set(4.4, 1.65, 1); }
  for (const s of shooters) { const u = (t - s.t0) / 1.1; s.m.visible = u > 0 && u < 1; if (!s.m.visible) continue; s.m.position.set(s.x0 + s.dx * u, s.y0 + s.dy * u, -110); s.m.rotation.z = Math.atan2(s.dy, s.dx); s.m.material.opacity = win(u, 0, 1, 0.2, 0.5) * 0.9; }
