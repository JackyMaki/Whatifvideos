<!DOCTYPE html>
<html lang="en">

</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ui">

<script type="module">
import { THREE, mulberry32, clamp, smooth, lerp, frac, kf, kfColor, win, radialTexture, textSprite, photoTexture, DAY, createWorld, createOverlay, injectBaseCss } from '../../render/common.js';
injectBaseCss();

const world = createWorld({ seed: 2126, canvas: document.getElementById('c'), flatRadius: 5, trees: 60,
  treeKeepOut: (x, z) => Math.hypot(x, z) < 9 || z < -16 || (Math.abs(x) < 5 && z > -16) });
const { rng, R, renderer, scene, camera, hemi, trunkMat, leafMats } = world;
const NIGHT_DAY = { ...DAY, hemiSky: [[0, '#8a7ab8'], [7, '#bfd8ff'], [34, '#e0b0b0'], [44, '#3e4e92'], [60, '#36468a']], hemiGround: [[0, '#4a3a3a'], [7, '#3a5a2a'], [44, '#1c2748'], [60, '#1a2440']] };

const lam = (c, extra = {}) => new THREE.MeshLambertMaterial({ color: c, flatShading: true, ...extra });

// ---------------------------------------------------------------------------
// Timeline constants
// ---------------------------------------------------------------------------
const WAKE = 11.8;                                   // the eyes open
const wakeU = t => smooth((t - WAKE) / 1.8);         // 0 lying .. 1 sitting
const sleepAgainU = t => smooth((t - 53.5) / 2.6);   // 0 sitting .. 1 lying (end)
const yearU = t => smooth((t - WAKE) / 1.9);
const cityU = t => kf(t, [[WAKE + 0.4, 0], [WAKE + 5.2, 1]]);
const cityLight = t => kf(t, [[30, 0.15], [38, 0.55], [44, 1], [60, 1]]);

const bed = new THREE.Group(); bed.position.y = -0.3; scene.add(bed);
{
  const wood = lam(0x8a5a3a);

}

  for (const sx of [-1, 1]) { const eye = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.05, 0.04), lam(0x222222)); eye.position.set(sx * 0.12, 0.02, 0.31); headG.add(eye); }

const bedShadow = new THREE.Mesh(new THREE.CircleGeometry(2.6, 8), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.18, depthWrite: false })); bedShadow.rotation.x = -Math.PI / 2; bedShadow.position.y = -0.29; bedShadow.scale.z = 1.5; scene.add(bedShadow);

{

  for (let k = 0; k < 4; k++) { const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 4.6, 4), lam(0x555e6e)); const a = k * Math.PI / 2 + 0.4; leg.position.set(Math.cos(a) * 0.9, 2.3, Math.sin(a) * 0.9); wt.add(leg); }

}
const towers = [], windowMats = [];
{
  const bodyCols = [0x6e7fa8, 0x8390b8, 0x5a6a94, 0x9aa6c8, 0x7b8bb5, 0x4f5f88];
  const winCols = [0x7cf5ff, 0x9fb4ff, 0xffd27a, 0xc7a6ff];
  for (let i = 0; i < 54; i++) {
    const x = R(-56, 56), z = -R(30, 58); const dist = -z;
    if (Math.abs(x) < 7 && z > -44) continue;          // keep the sky above the bed open
    const g = new THREE.Group(); const w = R(2.4, 5.5), d = R(2.4, 5.5); const h = R(4.5, 15) * lerp(0.9, 1.7, (dist - 30) / 28);
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), lam(bodyCols[i % bodyCols.length])); body.position.y = h / 2; g.add(body);
    const wm = new THREE.MeshBasicMaterial({ color: winCols[i % winCols.length], transparent: true, opacity: 0.9, toneMapped: false }); windowMats.push(wm);
    for (let y = 2.5; y < h - 1.5; y += R(2.6, 3.6)) { const band = new THREE.Mesh(new THREE.BoxGeometry(w + 0.06, 0.35, d + 0.06), wm); band.position.y = y; g.add(band); }
    const kind = rng();
    if (kind < 0.3) { const spire = new THREE.Mesh(new THREE.ConeGeometry(Math.min(w, d) * 0.35, h * 0.35, 4), lam(0xb9c4e0)); spire.position.y = h + h * 0.175; g.add(spire); }
    else if (kind < 0.42) { const ring = new THREE.Mesh(new THREE.TorusGeometry(Math.max(w, d) * 0.9, 0.22, 5, 18), glowMat(0x7cf5ff, 0.7)); ring.rotation.x = Math.PI / 2; ring.position.y = h * R(0.55, 0.85); g.add(ring); g.userData.ring = ring; }
    else if (kind < 0.7) { const cap = new THREE.Mesh(new THREE.CylinderGeometry(Math.max(w, d) * 0.75, Math.min(w, d) * 0.4, h * 0.12, 6), lam(0xa4b0d0)); cap.position.y = h + h * 0.06; g.add(cap); }
    g.position.set(x, world.terrainH(x, z) - 0.3, z); g.rotation.y = R(-0.2, 0.2);
    g.userData = { ...g.userData, base: g.position.y, h, delay: clamp((dist - 30) / 28, 0, 1) * 0.55 + R(0, 0.25) };
    scene.add(g); towers.push(g);
  }
  // hovering platforms
  for (let i = 0; i < 4; i++) {
    const g = new THREE.Group(); const r = R(3, 5.5);
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 0.8, 0.5, 8), lam(0x8d9bc2)); g.add(disc);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(r * 0.95, 0.18, 5, 24), glowMat(0x7cf5ff, 0.8)); rim.rotation.x = Math.PI / 2; rim.position.y = -0.2; g.add(rim);
    for (let k = 0; k < 3; k++) { const b = new THREE.Mesh(new THREE.BoxGeometry(R(0.8, 1.6), R(0.6, 1.4), R(0.8, 1.6)), lam(0xb9c4e0)); b.position.set(R(-r * 0.5, r * 0.5), 0.8, R(-r * 0.5, r * 0.5)); g.add(b); }
    g.userData = { x: R(-30, 30), y: R(12, 20), z: R(-50, -34), bob: R(0, 6.28), base: 0 }; g.visible = false; scene.add(g); towers.push(g); g.userData.platform = true; g.userData.delay = 0.6 + i * 0.1; g.userData.h = 30;
  }
}

// ---------------------------------------------------------------------------
// Flying cars (lanes in the sky), with light trails
// ---------------------------------------------------------------------------
const cars = [];
{
  const cols = [0xffffff, 0xff8a5a, 0x7cf5ff, 0xffd27a, 0xc7a6ff, 0x5aa65a, 0xe05a4f];
  for (let i = 0; i < 18; i++) {
    const g = new THREE.Group(); const big = i % 6 === 0; const L = big ? 2.6 : 1.3;
    const body = new THREE.Mesh(new THREE.BoxGeometry(L, big ? 0.5 : 0.34, big ? 0.9 : 0.6), lam(cols[i % cols.length])); g.add(body);
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(L * 0.55, 0.25, (big ? 0.9 : 0.6) * 0.8), lam(0x2a3550)); cabin.position.y = 0.28; g.add(cabin);
    const trail = new THREE.Mesh(new THREE.BoxGeometry(L * 2.2, 0.08, 0.12), glowMat(0x7cf5ff, 0.55)); g.add(trail); g.userData.trail = trail;
    const under = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialTexture(), color: 0x7cf5ff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false })); under.scale.setScalar(1.4 * (big ? 1.6 : 1)); under.position.y = -0.3; g.add(under);
    const dir = i % 2 ? 1 : -1; g.userData = { ...g.userData, y: R(5, 15), z: R(-40, -10), dir, speed: R(5, 11) * (big ? 0.6 : 1), x0: R(-45, 45), bob: R(0, 6.28) };
    trail.position.x = -dir * L * 1.4; g.rotation.y = dir > 0 ? 0 : Math.PI; g.visible = false; scene.add(g); cars.push(g);
  }
}

// ---------------------------------------------------------------------------
// Holographic screens, the old phone (24-33)
// ---------------------------------------------------------------------------
function holoTexture(kind) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 320; const g = c.getContext('2d');
  g.fillStyle = 'rgba(40,120,170,0.45)'; g.fillRect(0, 0, 512, 320); g.strokeStyle = '#9ff3ff'; g.lineWidth = 8; g.strokeRect(6, 6, 500, 308);
  g.fillStyle = '#e6fbff'; g.font = '700 46px Inter, sans-serif'; g.textBaseline = 'top';
  const titles = { weather: 'WEATHER · 24°  CLEAN AIR', news: 'NEWS · 2126', translate: 'TRANSLATE · 140 LANGUAGES', health: 'HEALTH · OPTIMAL', transit: 'SKY LANE 7 · 2 MIN', wallet: 'BALANCE · 0.00' };
  g.fillText(titles[kind] || kind, 26, 24);
  g.fillStyle = 'rgba(159,243,255,0.85)';
  const r = mulberry32(kind.length * 31);
  if (kind === 'news' || kind === 'translate') { for (let y = 100; y < 290; y += 38) g.fillRect(26, y, 120 + r() * 320, 16); }
  else if (kind === 'wallet') { g.font = '800 96px Inter, sans-serif'; g.fillStyle = '#ff9fb0'; g.fillText('0.00', 26, 120); g.font = '600 30px Inter'; g.fillStyle = '#e6fbff'; g.fillText('CURRENCY NOT RECOGNISED', 26, 240); }
  else { for (let x = 26; x < 480; x += 40) { const h = 40 + r() * 150; g.fillRect(x, 290 - h, 28, h); } }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; return tex;
}
const HOLO_SLOTS = [[-1.75, 4.9, 0.6], [1.75, 4.9, 0.6], [-2.05, 3.35, 1.0], [2.05, 3.35, 1.0]];
const holos = ['news', 'weather', 'translate', 'health'].map((kind, i) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 1.25), new THREE.MeshBasicMaterial({ map: holoTexture(kind), transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false, toneMapped: false }));
  m.visible = false; scene.add(m); const [x, y, z] = HOLO_SLOTS[i]; return { m, x, y, z, delay: i * 0.35, bob: R(0, 6.28) };
});
const phone = new THREE.Group();
{ phone.add(new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.08), lam(0x1a1d26))); const scr = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.0, 0.02), new THREE.MeshBasicMaterial({ color: 0x334, toneMapped: false })); scr.position.z = 0.045; phone.add(scr); phone.visible = false; scene.add(phone); }
const phoneTag = textSprite(scene, 'MUSEUM PIECE', { color: '#ffd166', size: 110 });

// ---------------------------------------------------------------------------
// Sunset shock: falling coins, drifting photographs (33-43.5)
// ---------------------------------------------------------------------------
const coins = [];
{
  const gold = lam(0xffc93c, { emissive: 0x7a5a10 }); const gray = lam(0x8a8f99);
  for (let i = 0; i < 44; i++) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.07, 8), gold.clone()); m.visible = false; scene.add(m);
    coins.push({ m, t0: 33.6 + R(0, 7.5), x: R(-3.5, 3.5), z: R(-2.5, 3), spin: R(2, 6), gray });

}

for (let i = 0; i < 8; i++) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 0.975), new THREE.MeshBasicMaterial({ map: photoTexture(300 + i), side: THREE.DoubleSide, transparent: true, opacity: 0, toneMapped: false }));
  m.visible = false; scene.add(m); photos.push({ m, t0: 37.2 + i * 0.45, dur: 4.2, x: R(-2.2, 2.2), z: R(-1, 2.5), drift: new THREE.Vector3(R(-2.5, 2.5), R(3, 5), R(-1, 1)), rot: R(-1, 1) });
}

// ---------------------------------------------------------------------------

const helix = new THREE.Group(); helix.position.set(0, 4.6, 0); helix.visible = false; scene.add(helix);
{
  const a = lam(0x5fe8d2, { emissive: 0x2fb5a0, emissiveIntensity: 0.9 }), b = lam(0x9ff3ff, { emissive: 0x3b9fd8, emissiveIntensity: 0.9 }), rung = glowMat(0xbdfff5, 0.75);

    helix.add(s1, s2, rg);

}
const healCount = 90, healPos = new Float32Array(healCount * 3), healSeed = [];
for (let i = 0; i < healCount; i++) healSeed.push({ az: R(0, 6.28), rad: R(0.8, 3.2), phase: rng(), speed: R(0.18, 0.4) });

function updateHud(t) {
  const u = yearU(t); const year = Math.round(lerp(2026, 2126, u));
  hud.num.textContent = String(year); hud.fill.style.width = `${u * 100}%`;
  hud.num.style.color = u < 1 && u > 0 ? '#7cf5ff' : '#fff';
  hud.label.textContent = t >= 43.5 && t < 52.5 ? 'YEAR · YOU COULD SEE 2226' : t >= 52.5 ? 'YEAR · 100 YEARS LATER' : 'YEAR';
}

// ---------------------------------------------------------------------------
// Per-frame update
// ---------------------------------------------------------------------------
const tmpV = new THREE.Vector3(), tmpC = new THREE.Color();
window.renderAt = function (t) {
  const { nt } = world.updateEnvironment(t, NIGHT_DAY);
  moonLamp.intensity = nt * 30;

  // --- sleeper pose ---
  const sit = wakeU(t) * (1 - sleepAgainU(t));
  const slump = win(t, 33.5, 43.0, 2.5, 1.5);
  const startle = Math.exp(-Math.max(0, t - WAKE - 1.2) * 3) * (t > WAKE + 1.2 ? 1 : 0);
  upper.rotation.x = lerp(-1.42, -0.08 + startle * -0.12 + slump * 0.32, sit) + (sit > 0.95 ? Math.sin(t * 2.1) * 0.015 : 0);
  const head = upper.userData.head;
  head.rotation.y = sit * (Math.sin(t * 0.9) * 0.55 * (t > WAKE + 1.5 && t < 33 ? 1 : 0.25) + startle * 0.6);
  head.rotation.x = sit * (slump * 0.45 - 0.08 * win(t, 15, 24, 1, 1) + (t >= 43.5 && t < 52.5 ? -0.25 : 0));
  // zzz while asleep
  const asleep = Math.max(win(t, -1, WAKE + 0.4, 0.1, 0.9), win(t, 56.6, 61, 0.9, 0.1));
  for (const z of zzz) {
    const life = frac(t * 0.45 + z.k / 3); tmpV.set(0.6 + life * 1.2, 1.9 + life * 2.2, -1.2 + life * 0.4);
    z.s.position.copy(tmpV.add(bed.position)); z.s.scale.setScalar(0.9 + life * 1.3); z.s.material.opacity = asleep * win(life, 0, 1, 0.15, 0.35) * 0.9;
  }

  // --- town sinks, skyline rises ---
  const cu = cityU(t);
  for (const h of houses) { const u = smooth((cu - h.userData.delay * 0.6) / 0.4); h.position.y = h.userData.base - h.userData.h * 1.3 * u; h.visible = u < 1; }
  const lit = cityLight(t) * (0.35 + 0.65 * nt) + 0.12;
  for (const tw of towers) {
    const u = smooth((cu - tw.userData.delay) / 0.45);
    if (tw.userData.platform) { tw.visible = u > 0; const d = tw.userData; tw.position.set(d.x, d.y * u + Math.sin(t * 0.6 + d.bob) * 0.4, d.z); tw.scale.setScalar(Math.max(0.001, u)); continue; }
    tw.visible = u > 0; tw.position.y = tw.userData.base - tw.userData.h * (1 - u); tw.scale.y = Math.max(0.001, u);
    if (tw.userData.ring) tw.userData.ring.rotation.z = t * 0.3;
  }
  for (const wm of windowMats) wm.opacity = clamp(lit, 0.1, 1);
  // --- flying cars ---
  const carsOn = kf(t, [[14.2, 0], [16.5, 1]]);
  for (const c of cars) {
    const d = c.userData; c.visible = carsOn > 0; if (!c.visible) continue;
    const x = ((d.x0 + d.dir * d.speed * t + 45) % 90 + 90) % 90 - 45;
    c.position.set(x, d.y + Math.sin(t * 1.3 + d.bob) * 0.25, d.z); c.scale.setScalar(carsOn);
    d.trail.material.opacity = 0.35 + 0.35 * nt;
  }

  // --- holo screens & phone (24-33) ---
  for (const h of holos) {
    const on = win(t, 24.4 + h.delay, 32.6, 0.6, 0.7); h.m.visible = on > 0; if (!on) continue;
    h.m.position.set(h.x, h.y + Math.sin(t * 1.4 + h.bob) * 0.12, h.z);
    h.m.lookAt(camera.position); h.m.material.opacity = on * 0.92; h.m.scale.set(1, on, 1);
  }
  { const u = (t - 24.6) / 5.4; const on = u > 0 && u < 1 ? win(u, 0, 1, 0.1, 0.2) : 0; phone.visible = on > 0;
    if (on) { const drop = smooth((u - 0.6) / 0.4); phone.position.set(1.35, 1.95 + Math.sin(t * 2) * 0.1 - drop * 1.6, 2.6); phone.rotation.set(drop * 1.6, t * 0.8, drop * 0.6); phone.scale.setScalar(on);
      phoneTag.position.set(1.1, 2.75 - drop * 0.5, 2.6); phoneTag.scale.set(2.4, 0.9, 1); phoneTag.material.opacity = on * (1 - drop); } else phoneTag.material.opacity = 0; }

  // --- coins & photos (33-43.5) ---
  for (const c of coins) {
    const u = (t - c.t0) / 2.4; c.m.visible = u > 0 && u < 1; if (!c.m.visible) continue;
    c.m.position.set(c.x, 7.5 - u * u * 7.2, c.z); c.m.rotation.set(t * c.spin, t * c.spin * 0.6, 0);
    c.m.material.color.copy(tmpC.set(0xffc93c).lerp(c.gray.color, smooth(u * 1.4))); c.m.material.emissiveIntensity = 1 - u; c.m.material.transparent = true; c.m.material.opacity = 1 - smooth((u - 0.7) / 0.3);
  }
  for (const p of photos) {
    const u = (t - p.t0) / p.dur; p.m.visible = u > 0 && u < 1; if (!p.m.visible) continue;
    p.m.position.set(p.x + p.drift.x * u, 1.6 + p.drift.y * u, p.z + p.drift.z * u); p.m.rotation.set(u * p.rot, t * 0.8, u * p.rot * 0.5);
    p.m.material.opacity = win(u, 0, 1, 0.15, 0.5); p.m.material.color.setScalar(1 - u * 0.5);
  }

  // --- helix & healing (43.5-52.5) ---
  const hel = win(t, 43.7, 52.3, 1.3, 1.2); helix.visible = hel > 0;
  helix.rotation.y = t * 0.9; helix.scale.setScalar(Math.max(0.001, hel)); helix.position.y = 4.6 + Math.sin(t * 0.7) * 0.2;
  helixLight.intensity = hel * 28; heal.material.opacity = hel * 0.9;
  if (hel > 0) { for (let i = 0; i < healCount; i++) { const s = healSeed[i]; const life = frac(t * s.speed + s.phase); healPos[i * 3] = Math.sin(s.az + life * 1.5) * s.rad; healPos[i * 3 + 1] = 0.6 + life * 6.5; healPos[i * 3 + 2] = Math.cos(s.az + life * 1.5) * s.rad * 0.7; } healGeo.attributes.position.needsUpdate = true; }
  { const on = win(t, 48.6, 52.0, 0.6, 0.8); yearTag.material.opacity = on; yearTag.position.set(0, 8.1 + (1 - on) * 0.4, 0); yearTag.scale.set(4.4, 1.65, 1); }

  // --- shooting stars ---
  for (const s of shooters) { const u = (t - s.t0) / 1.1; s.m.visible = u > 0 && u < 1; if (!s.m.visible) continue; s.m.position.set(s.x0 + s.dx * u, s.y0 + s.dy * u, -110); s.m.rotation.z = Math.atan2(s.dy, s.dx); s.m.material.opacity = win(u, 0, 1, 0.2, 0.5) * 0.9; }

  // --- camera ---
  camera.position.set(kf(t, CAM.x) + Math.sin(t * 0.37) * 0.2, kf(t, CAM.y) + Math.sin(t * 0.5) * 0.1, kf(t, CAM.z));
  camera.lookAt(0, kf(t, CAM.ty), 0);
  bedShadow.material.opacity = 0.18 * (1 - nt * 0.6);
  renderer.render(scene, camera);
  overlay.update(t); updateHud(t);
  return true;
};
window.renderAt(0);
window.__sceneReady = true;
